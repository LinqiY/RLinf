defaults:
  - env/vlabench_select_fruit@env.train
  - model/mlp_policy@actor.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout,actor: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "vlabench_rollout_smoke"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: -1
  save_interval: -1

algorithm:
  group_size: 1
  gamma: 0.8
  gae_lambda: 0.9
  reward_type: action_level

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 1
    num_envs: 1
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    return_tensors: true
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/train

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  pipeline_stage_num: 1
  collect_transitions: false
  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  seed: 1234
  model:
    model_path: ""
    model_type: "mlp_policy"
    obs_dim: 7
    action_dim: 7
    num_action_chunks: 2

reward:
  use_reward_model: false

critic:
  use_critic_model: false
